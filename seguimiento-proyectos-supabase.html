<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento de Proyectos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #14151a;
    --bg-panel: #1c1d24;
    --bg-panel-2: #22232b;
    --border: #2e2f38;
    --text: #e9e9ee;
    --text-dim: #9a9ba6;
    --accent: #d97b3f;
    --accent-dim: #7a4a2a;
    --danger: #c0473f;
    --ok: #4f9d69;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f3f0;
      --bg-panel: #ffffff;
      --bg-panel-2: #f0efec;
      --border: #dcdad4;
      --text: #1c1c1f;
      --text-dim: #6b6b72;
      --accent: #b85c26;
      --accent-dim: #e8caa8;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { font-size: 1.1rem; margin: 0; letter-spacing: 0.02em; font-weight: 600; }
  header .sub { font-size: 0.78rem; color: var(--text-dim); }
  .areas-bar {
    display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto;
    border-bottom: 1px solid var(--border); background: var(--bg-panel);
  }
  .area-tab {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-panel-2);
    color: var(--text-dim); font-size: 0.85rem; cursor: pointer; white-space: nowrap;
  }
  .area-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .area-tab-add {
    flex: 0 0 auto; padding: 7px 12px; border-radius: 8px;
    border: 1px dashed var(--border); background: transparent;
    color: var(--text-dim); font-size: 0.85rem; cursor: pointer;
  }
  main { flex: 1; overflow-y: auto; padding: 20px; max-width: 720px; width: 100%; margin: 0 auto; }
  .no-area, .center-msg { color: var(--text-dim); text-align: center; padding: 60px 20px; }
  .center-msg code {
    background: var(--bg-panel-2); padding: 2px 6px; border-radius: 4px;
    font-size: 0.85em; color: var(--text);
  }
  .area-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .area-header h2 { margin: 0; font-size: 1.3rem; }
  .remove-area-btn {
    font-size: 0.75rem; color: var(--danger); background: transparent;
    border: 1px solid var(--danger); border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  .view-toggle { display: flex; gap: 6px; margin-bottom: 18px; }
  .view-toggle button {
    flex: 1; padding: 9px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-panel); color: var(--text-dim); font-size: 0.85rem; cursor: pointer;
  }
  .view-toggle button.active { background: var(--bg-panel-2); color: var(--text); border-color: var(--accent); }
  label {
    display: block; font-size: 0.78rem; color: var(--text-dim); margin: 16px 0 6px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  label:first-of-type { margin-top: 0; }
  textarea {
    width: 100%; min-height: 90px; background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 0.92rem;
    font-family: inherit; resize: vertical;
  }
  textarea:focus, input:focus { outline: 1px solid var(--accent); }
  .img-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .img-thumb { position: relative; width: 72px; height: 72px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); background: var(--bg-panel-2); }
  .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-thumb.uploading { display: flex; align-items: center; justify-content: center; font-size: 0.65rem; color: var(--text-dim); text-align: center; }
  .img-thumb .rm {
    position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.6); color: #fff;
    border: none; border-radius: 4px; width: 18px; height: 18px; font-size: 11px; line-height: 1; cursor: pointer;
  }
  .upload-btn {
    display: inline-block; margin-top: 8px; padding: 8px 14px; border-radius: 8px;
    border: 1px dashed var(--border); color: var(--text-dim); font-size: 0.82rem; cursor: pointer;
  }
  .save-bar { display: flex; gap: 10px; margin-top: 22px; }
  .save-btn {
    flex: 1; padding: 12px; border-radius: 8px; border: none; background: var(--accent);
    color: #fff; font-size: 0.92rem; font-weight: 600; cursor: pointer;
  }
  .save-btn:disabled { opacity: 0.6; cursor: default; }
  .clear-btn { background: var(--bg-panel-2); color: var(--text-dim); border: 1px solid var(--border); flex: 0 0 auto; padding: 12px 16px; }
  .status-line { font-size: 0.75rem; color: var(--ok); text-align: center; margin-top: 8px; min-height: 1em; }
  .status-line.error { color: var(--danger); }
  .log-entry { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .log-date { font-size: 0.78rem; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
  .log-field-label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 8px; }
  .log-field-label:first-of-type { margin-top: 0; }
  .log-field-text { font-size: 0.88rem; white-space: pre-wrap; margin-top: 2px; }
  .log-empty { color: var(--text-dim); text-align: center; padding: 30px 10px; font-size: 0.88rem; }
  .del-log-btn { float: right; font-size: 0.7rem; color: var(--text-dim); background: transparent; border: none; cursor: pointer; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 340px; }
  .modal h3 { margin: 0 0 12px; font-size: 1rem; }
  .modal input { width: 100%; padding: 9px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-panel-2); color: var(--text); font-size: 0.9rem; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; padding: 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-panel-2); color: var(--text); cursor: pointer; font-size: 0.85rem; }
  .modal-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>

<header>
  <h1>Seguimiento de Proyectos</h1>
  <span class="sub" id="today-label"></span>
</header>

<div class="areas-bar" id="areas-bar"></div>

<main id="main"></main>

<div id="modal-root"></div>

<script>
/* =========================================================
   CONFIGURA AQUÍ TUS DATOS DE SUPABASE
   (Project Settings -> API en tu dashboard de Supabase)
   ========================================================= */
const SUPABASE_URL = "https://fetmlcxwgjeljoapgkjk.supabase.co";       // ej. https://abcxyz.supabase.co
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZldG1sY3h3Z2plbGpvYXBna2prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NTI2OTYsImV4cCI6MjEwNjQyODY5Nn0.rMwChWZOb_EdMJx-qfe9xg7NUmifCaXIIPbPW5if7AM";
const IMAGES_BUCKET = "project-images";            // nombre del bucket de Storage
/* ========================================================= */

const todayLabel = document.getElementById("today-label");
todayLabel.textContent = new Date().toLocaleDateString("es-MX", { weekday: "long", year: "numeric", month: "long", day: "numeric" });

const main = document.getElementById("main");
const areasBar = document.getElementById("areas-bar");

if (!SUPABASE_URL || SUPABASE_URL === "TU_SUPABASE_URL_AQUI" || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "TU_SUPABASE_ANON_KEY_AQUI") {
  main.innerHTML = `<div class="center-msg">
    Falta configurar Supabase.<br><br>
    Abre este archivo y reemplaza <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code>
    (cerca del inicio de la etiqueta &lt;script&gt;) con los datos de tu proyecto,
    disponibles en Project Settings → API en tu dashboard de Supabase.
  </div>`;
  throw new Error("Supabase no configurado");
}

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let areas = [];          // [{id, name, position, notes_today, notes_tomorrow, images}]
let activeAreaId = null;
let currentView = "estado"; // "estado" | "historial"
let pendingImages = [];  // array de URLs públicas, para la pantalla "estado actual" sin guardar aún
let logsCache = {};      // areaId -> array de entradas de historial ya cargadas

async function init() {
  main.innerHTML = `<div class="center-msg">Cargando...</div>`;
  try {
    const { data, error } = await supabase
      .from("work_areas")
      .select("*")
      .order("position", { ascending: true });
    if (error) throw error;

    if (!data || data.length === 0) {
      const defaults = ["Trama", "Guion", "Mariposa Negra", "Albatros Media"];
      const rows = defaults.map((name, i) => ({ name, position: i, notes_today: "", notes_tomorrow: "", images: [] }));
      const { data: inserted, error: insErr } = await supabase.from("work_areas").insert(rows).select();
      if (insErr) throw insErr;
      areas = inserted.sort((a, b) => a.position - b.position);
    } else {
      areas = data;
    }

    activeAreaId = areas[0]?.id || null;
    render();
  } catch (e) {
    console.error(e);
    main.innerHTML = `<div class="center-msg">No se pudo conectar con Supabase.<br><br>
      Revisa que la URL y la anon key sean correctas, que las tablas existan,
      y que las políticas de Row Level Security permitan leer/escribir.<br><br>
      <span style="color: var(--danger); font-size: 0.8em;">${(e.message || e).toString()}</span>
    </div>`;
  }
}

function renderAreasBar() {
  areasBar.innerHTML = "";
  areas.forEach(area => {
    const btn = document.createElement("button");
    btn.className = "area-tab" + (area.id === activeAreaId ? " active" : "");
    btn.textContent = area.name;
    btn.onclick = () => { activeAreaId = area.id; currentView = "estado"; render(); };
    areasBar.appendChild(btn);
  });
  const addBtn = document.createElement("button");
  addBtn.className = "area-tab-add";
  addBtn.textContent = "+ área";
  addBtn.onclick = showAddAreaModal;
  areasBar.appendChild(addBtn);
}

function showAddAreaModal() {
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-bg" id="modal-bg">
      <div class="modal">
        <h3>Nueva área de trabajo</h3>
        <input id="new-area-input" type="text" placeholder="Nombre del área" maxlength="40" />
        <div class="modal-actions">
          <button id="modal-cancel">Cancelar</button>
          <button id="modal-confirm" class="primary">Agregar</button>
        </div>
      </div>
    </div>`;
  const bg = document.getElementById("modal-bg");
  const input = document.getElementById("new-area-input");
  input.focus();
  document.getElementById("modal-cancel").onclick = () => root.innerHTML = "";
  bg.onclick = (e) => { if (e.target === bg) root.innerHTML = ""; };
  const confirm = async () => {
    const name = input.value.trim();
    if (!name) return;
    if (areas.some(a => a.name === name)) { alert("Esa área ya existe."); return; }
    const position = areas.length ? Math.max(...areas.map(a => a.position)) + 1 : 0;
    const { data, error } = await supabase
      .from("work_areas")
      .insert([{ name, position, notes_today: "", notes_tomorrow: "", images: [] }])
      .select();
    if (error) { alert("No se pudo crear el área: " + error.message); return; }
    areas.push(data[0]);
    activeAreaId = data[0].id;
    currentView = "estado";
    root.innerHTML = "";
    render();
  };
  document.getElementById("modal-confirm").onclick = confirm;
  input.onkeydown = (e) => { if (e.key === "Enter") confirm(); };
}

async function removeArea(area) {
  if (!confirm(`¿Quitar el área "${area.name}"? Se perderá su historial guardado.`)) return;
  const { error } = await supabase.from("work_areas").delete().eq("id", area.id);
  if (error) { alert("No se pudo quitar el área: " + error.message); return; }
  areas = areas.filter(a => a.id !== area.id);
  delete logsCache[area.id];
  activeAreaId = areas[0]?.id || null;
  currentView = "estado";
  render();
}

async function uploadImageFile(file, areaId) {
  const path = `${areaId}/${crypto.randomUUID()}-${file.name}`;
  const { error: upErr } = await supabase.storage.from(IMAGES_BUCKET).upload(path, file);
  if (upErr) throw upErr;
  const { data } = supabase.storage.from(IMAGES_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

function renderImgRow(container, images, onRemove) {
  container.innerHTML = "";
  images.forEach((src, idx) => {
    const thumb = document.createElement("div");
    thumb.className = "img-thumb";
    const img = document.createElement("img");
    img.src = src;
    thumb.appendChild(img);
    const rm = document.createElement("button");
    rm.className = "rm";
    rm.textContent = "×";
    rm.onclick = () => onRemove(idx);
    thumb.appendChild(rm);
    container.appendChild(thumb);
  });
}

function renderEstadoActual(area) {
  pendingImages = [...(area.images || [])];
  const wrap = document.createElement("div");

  const label1 = document.createElement("label");
  label1.textContent = "Notas del proceso (qué se hizo hoy)";
  wrap.appendChild(label1);
  const ta1 = document.createElement("textarea");
  ta1.value = area.notes_today || "";
  wrap.appendChild(ta1);

  const label2 = document.createElement("label");
  label2.textContent = "Qué sigue mañana";
  wrap.appendChild(label2);
  const ta2 = document.createElement("textarea");
  ta2.value = area.notes_tomorrow || "";
  wrap.appendChild(ta2);

  const label3 = document.createElement("label");
  label3.textContent = "Imágenes";
  wrap.appendChild(label3);

  const imgRow = document.createElement("div");
  imgRow.className = "img-row";
  wrap.appendChild(imgRow);

  const refreshImgs = () => renderImgRow(imgRow, pendingImages, (idx) => {
    pendingImages.splice(idx, 1);
    refreshImgs();
  });
  refreshImgs();

  const uploadLabel = document.createElement("label");
  uploadLabel.className = "upload-btn";
  uploadLabel.textContent = "+ Subir imagen";
  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = "image/*";
  fileInput.multiple = true;
  fileInput.style.display = "none";
  fileInput.onchange = async () => {
    const files = Array.from(fileInput.files);
    fileInput.value = "";
    const placeholderIdxs = [];
    files.forEach(() => { placeholderIdxs.push(pendingImages.length); pendingImages.push(null); });
    refreshPlaceholders();
    for (let i = 0; i < files.length; i++) {
      try {
        const url = await uploadImageFile(files[i], area.id);
        pendingImages[placeholderIdxs[i]] = url;
      } catch (e) {
        console.error(e);
        alert("No se pudo subir una imagen: " + (e.message || e));
        pendingImages[placeholderIdxs[i]] = "__failed__";
      }
      refreshPlaceholders();
    }
    pendingImages = pendingImages.filter(u => u && u !== "__failed__");
    refreshImgs();
  };
  function refreshPlaceholders() {
    imgRow.innerHTML = "";
    pendingImages.forEach((src, idx) => {
      const thumb = document.createElement("div");
      if (!src) {
        thumb.className = "img-thumb uploading";
        thumb.textContent = "subiendo…";
      } else if (src === "__failed__") {
        thumb.className = "img-thumb uploading";
        thumb.textContent = "error";
      } else {
        thumb.className = "img-thumb";
        const img = document.createElement("img");
        img.src = src;
        thumb.appendChild(img);
        const rm = document.createElement("button");
        rm.className = "rm";
        rm.textContent = "×";
        rm.onclick = () => { pendingImages.splice(idx, 1); refreshPlaceholders(); };
        thumb.appendChild(rm);
      }
      imgRow.appendChild(thumb);
    });
  }
  uploadLabel.appendChild(fileInput);
  wrap.appendChild(uploadLabel);

  const saveBar = document.createElement("div");
  saveBar.className = "save-bar";
  const saveBtn = document.createElement("button");
  saveBtn.className = "save-btn";
  saveBtn.textContent = "Guardar avance";
  saveBar.appendChild(saveBtn);

  const clearBtn = document.createElement("button");
  clearBtn.className = "save-btn clear-btn";
  clearBtn.textContent = "Limpiar";
  clearBtn.type = "button";
  saveBar.appendChild(clearBtn);

  wrap.appendChild(saveBar);

  const statusLine = document.createElement("div");
  statusLine.className = "status-line";
  wrap.appendChild(statusLine);

  saveBtn.onclick = async () => {
    const notesToday = ta1.value.trim();
    const notesTomorrow = ta2.value.trim();
    const images = pendingImages.filter(u => u && u !== "__failed__");
    saveBtn.disabled = true;
    statusLine.className = "status-line";
    statusLine.textContent = "Guardando…";
    try {
      const { error: updErr } = await supabase
        .from("work_areas")
        .update({ notes_today: notesToday, notes_tomorrow: notesTomorrow, images })
        .eq("id", area.id);
      if (updErr) throw updErr;

      const { error: logErr } = await supabase
        .from("log_entries")
        .insert([{ area_id: area.id, notes_today: notesToday, notes_tomorrow: notesTomorrow, images }]);
      if (logErr) throw logErr;

      area.notes_today = notesToday;
      area.notes_tomorrow = notesTomorrow;
      area.images = images;
      delete logsCache[area.id]; // forzar recarga del historial la próxima vez que se vea

      statusLine.textContent = "Guardado ✓";
    } catch (e) {
      console.error(e);
      statusLine.className = "status-line error";
      statusLine.textContent = "No se pudo guardar: " + (e.message || e);
    } finally {
      saveBtn.disabled = false;
      setTimeout(() => { statusLine.textContent = ""; statusLine.className = "status-line"; }, 3000);
    }
  };

  clearBtn.onclick = () => {
    if (!confirm("¿Poner en blanco los campos de texto e imágenes de esta pantalla? (No se guarda hasta que presiones Guardar avance)")) return;
    ta1.value = "";
    ta2.value = "";
    pendingImages = [];
    refreshImgs();
  };

  return wrap;
}

async function renderHistorial(area) {
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="center-msg" style="padding:30px 10px;">Cargando historial...</div>`;

  if (!logsCache[area.id]) {
    const { data, error } = await supabase
      .from("log_entries")
      .select("*")
      .eq("area_id", area.id)
      .order("created_at", { ascending: false })
      .limit(200);
    if (error) {
      wrap.innerHTML = `<div class="center-msg">No se pudo cargar el historial: ${error.message}</div>`;
      return wrap;
    }
    logsCache[area.id] = data;
  }

  const logs = logsCache[area.id];
  wrap.innerHTML = "";

  if (logs.length === 0) {
    const empty = document.createElement("div");
    empty.className = "log-empty";
    empty.textContent = "Aún no hay entradas en el historial de esta área.";
    wrap.appendChild(empty);
    return wrap;
  }

  logs.forEach((entry) => {
    const card = document.createElement("div");
    card.className = "log-entry";

    const del = document.createElement("button");
    del.className = "del-log-btn";
    del.textContent = "eliminar";
    del.onclick = async () => {
      if (!confirm("¿Eliminar esta entrada del historial?")) return;
      const { error } = await supabase.from("log_entries").delete().eq("id", entry.id);
      if (error) { alert("No se pudo eliminar: " + error.message); return; }
      delete logsCache[area.id];
      render();
    };
    card.appendChild(del);

    const dateEl = document.createElement("div");
    dateEl.className = "log-date";
    const d = new Date(entry.created_at);
    dateEl.textContent = d.toLocaleDateString("es-MX", { weekday: "long", year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });
    card.appendChild(dateEl);

    if (entry.notes_today) {
      const l1 = document.createElement("div");
      l1.className = "log-field-label";
      l1.textContent = "Qué se hizo";
      card.appendChild(l1);
      const t1 = document.createElement("div");
      t1.className = "log-field-text";
      t1.textContent = entry.notes_today;
      card.appendChild(t1);
    }

    if (entry.notes_tomorrow) {
      const l2 = document.createElement("div");
      l2.className = "log-field-label";
      l2.textContent = "Qué sigue";
      card.appendChild(l2);
      const t2 = document.createElement("div");
      t2.className = "log-field-text";
      t2.textContent = entry.notes_tomorrow;
      card.appendChild(t2);
    }

    if (entry.images && entry.images.length) {
      const imgRow = document.createElement("div");
      imgRow.className = "img-row";
      entry.images.forEach(src => {
        const thumb = document.createElement("div");
        thumb.className = "img-thumb";
        const img = document.createElement("img");
        img.src = src;
        thumb.appendChild(img);
        imgRow.appendChild(thumb);
      });
      card.appendChild(imgRow);
    }

    wrap.appendChild(card);
  });

  return wrap;
}

async function render() {
  renderAreasBar();
  main.innerHTML = "";

  if (!activeAreaId || !areas.some(a => a.id === activeAreaId)) {
    activeAreaId = areas[0]?.id || null;
  }

  if (!activeAreaId) {
    const div = document.createElement("div");
    div.className = "no-area";
    div.textContent = "No hay áreas de trabajo. Agrega una para comenzar.";
    main.appendChild(div);
    return;
  }

  const area = areas.find(a => a.id === activeAreaId);

  const areaHeader = document.createElement("div");
  areaHeader.className = "area-header";
  const h2 = document.createElement("h2");
  h2.textContent = area.name;
  areaHeader.appendChild(h2);
  const rmBtn = document.createElement("button");
  rmBtn.className = "remove-area-btn";
  rmBtn.textContent = "Quitar área";
  rmBtn.onclick = () => removeArea(area);
  areaHeader.appendChild(rmBtn);
  main.appendChild(areaHeader);

  const toggle = document.createElement("div");
  toggle.className = "view-toggle";
  const btnEstado = document.createElement("button");
  btnEstado.textContent = "Estado actual";
  btnEstado.className = currentView === "estado" ? "active" : "";
  btnEstado.onclick = () => { currentView = "estado"; render(); };
  const btnHistorial = document.createElement("button");
  btnHistorial.textContent = "Historial";
  btnHistorial.className = currentView === "historial" ? "active" : "";
  btnHistorial.onclick = () => { currentView = "historial"; render(); };
  toggle.appendChild(btnEstado);
  toggle.appendChild(btnHistorial);
  main.appendChild(toggle);

  if (currentView === "estado") {
    main.appendChild(renderEstadoActual(area));
  } else {
    main.appendChild(await renderHistorial(area));
  }
}

init();
</script>
</body>
</html>
